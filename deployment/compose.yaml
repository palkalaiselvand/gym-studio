services:
  api:
    image: gym-studio-api:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: deployment/api.Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      NODE_ENV: production
      PORT: 5000
      DATA_DIR: /data
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in deployment/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deployment/.env}
      UI_ORIGINS: ${UI_ORIGINS:?Set UI_ORIGINS in deployment/.env}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - gym_data:/data
      - ./backups:/backups
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ui:
    image: gym-studio-ui:${APP_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: deployment/ui.Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gym_data:
